name: Auto-merge Dependabot minor updates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check if the update is minor or patch (non-major)
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/from\s+(\S+)\s+to\s+(\S+)/i);
            if (!match) {
              core.info(`No from/to versions found in title: "${title}" - skipping auto-merge`);
              core.setOutput('merge', 'false');
              return;
            }
            const parse = (v) => v.replace(/^v/i, '').split('.').map((n) => parseInt(n, 10) || 0);
            const cmp = (a, b) => {
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d !== 0) return d;
              }
              return 0;
            };
            const from = parse(match[1]);
            const to = parse(match[2]);
            const isNonMajor = from[0] === to[0] && cmp(to, from) > 0;
            core.info(`Update ${match[1]} -> ${match[2]}: ${isNonMajor ? 'minor/patch, will auto-merge' : 'major, skipping'}`);
            core.setOutput('merge', String(isNonMajor));

      - name: Auto-merge the pull request
        if: steps.check.outputs.merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --merge "$PR_URL"
